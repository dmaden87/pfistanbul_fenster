<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Story – Bestellen Sie noch heute</title>
<link rel="stylesheet" href="story.css">
<style>
/*
 * Die Aufforderung als Schlagzeile, darueber die Gewebeaufnahme.
 *
 * Das Foto ist nicht Schmuck: der Kontoname sagt niemandem etwas, und ohne
 * Bild waere bis zur dritten Zeile unklar, wovon die Rede ist. Die
 * Makroaufnahme zeigt das Produkt aus der Naehe, ohne Wohnzimmer und ohne
 * Menschen - sie traegt die Aussage, statt von ihr abzulenken.
 *
 * Das Foto laeuft nach unten in den hellen Grund aus, damit die Schrift auf
 * ruhiger Flaeche steht. Ein harter Schnitt wuerde die Seite in zwei
 * Haelften teilen; der Verlauf haelt sie zusammen.
 *
 * Die Statuszeile oben traegt "wir sind live" und "erste Bestellungen
 * laufen", damit die Schlagzeile die Aufforderung sein kann und nicht die
 * Ankuendigung. DIE ZEILE MUSS STIMMEN: Sobald die erste Lieferung draussen
 * ist, gehoert sie umgeschrieben.
 */
.blatt { position: relative; padding: 0; background: #faf8f4; color: #17211f; overflow: hidden; }
.foto { position: absolute; inset: 0 0 auto 0; height: 1020px; }
.foto img { width: 100%; height: 100%; object-fit: cover; object-position: center 50%; }
.foto::after { content: ''; position: absolute; inset: auto 0 0 0; height: 400px;
               background: linear-gradient(to bottom, rgba(250,248,244,0), #faf8f4 88%); }
.inhalt { position: relative; height: 100%; padding: 250px 80px 300px; display: flex; flex-direction: column; }
.marke__zeichen { background: rgba(0,0,0,.34); color: #f7fbf9; }
.marke { color: #f7fbf9; text-shadow: 0 2px 14px rgba(0,0,0,.5); }
.status { margin-top: auto; align-self: flex-start; display: flex; align-items: center; gap: 16px;
          padding: 18px 30px 18px 24px; border-radius: 100px;
          background: #e6f2ec; border: 2px solid #b7ddcd;
          font-size: 28px; font-weight: 600; color: #0f3b34; }
.status span { flex: none; width: 14px; height: 14px; border-radius: 50%; background: #1c8f6e; }
h1 { margin-top: 30px; font-size: 118px; }
h1 em { color: #0f3b34; }
.satz { margin-top: 32px; font-size: 36px; line-height: 1.36; color: #34433f; max-width: 22ch; }
.satz b { color: #17211f; }
.band { margin-top: 44px; background: #0f3b34; color: #f7fbf9; }
</style></head><body><div class="blatt">
  <figure class="foto"><img src="../public/fotos/gewebe-detail-1600.jpg" alt=""></figure>
  <div class="inhalt">
    <div class="marke"><span class="marke__zeichen"><svg width="34" height="34" viewBox="0 0 300 300"><rect x="30" y="30" width="240" height="240" rx="30" fill="none" stroke="currentColor" stroke-width="26"/><path d="M30 110H270M30 190H270M110 30V270M190 30V270" stroke="currentColor" stroke-width="18" stroke-linecap="round"/></svg></span>
      <span><span class="marke__name">Pfistanbul</span><br><span class="marke__zusatz">Fenster</span></span></div>
    <p class="status"><span></span>Live · erste Bestellungen in Arbeit</p>
    <h1>Bestellen Sie<em>noch heute.</em></h1>
    <p class="satz"><b>Insektenschutz-Plissee nach Mass.</b> Jedes Netz wird auf Bestellung gefertigt – wer jetzt bestellt, ist bei der ersten Lieferung dabei.</p>
    <div class="band"><span class="band__was">Dauert zwei Minuten</span><span class="band__wo">pfistanbul.ch</span></div>
  </div>
</div></body></html>
