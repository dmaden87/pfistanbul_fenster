<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Story B – Erste Bestellungen</title>
<link rel="stylesheet" href="story.css">
<style>
/* Vorschlag B: der soziale Beweis. Wirkt nur, wenn er stimmt - deshalb
   keine erfundenen Zahlen, sondern die zwei Tatsachen, die es gibt. */
.blatt { background: #faf8f4; color: #17211f; }
.marke__zeichen { background: #0f3b34; color: #f7fbf9; }
.marke__zusatz { color: #4d5b57; }
h1 { margin-top: 60px; font-size: 108px; }
h1 em { color: #0f3b34; }
.liste { margin-top: 56px; display: flex; flex-direction: column; gap: 22px; }
.punkt { display: flex; align-items: flex-start; gap: 20px; font-size: 36px; line-height: 1.32; }
.haken { flex: none; display: grid; place-items: center; width: 52px; height: 52px; border-radius: 50%;
         background: #dcefe7; color: #0f3b34; font-size: 30px; font-weight: 700; }
.dank { margin-top: 54px; font-family: 'Fraunces', Georgia, serif; font-style: italic; font-weight: 600;
        font-size: 46px; color: #0f3b34; }
.band { background: #0f3b34; color: #f7fbf9; }
</style></head><body><div class="blatt">
  <div class="marke"><span class="marke__zeichen"><svg width="34" height="34" viewBox="0 0 300 300"><rect x="30" y="30" width="240" height="240" rx="30" fill="none" stroke="currentColor" stroke-width="26"/><path d="M30 110H270M30 190H270M110 30V270M190 30V270" stroke="currentColor" stroke-width="18" stroke-linecap="round"/></svg></span>
    <span><span class="marke__name">Pfistanbul</span><br><span class="marke__zusatz">Fenster</span></span></div>
  <h1>Der erste<em>Tag.</em></h1>
  <div class="liste">
    <div class="punkt"><span class="haken">✓</span><span>Die ersten Bestellungen sind da</span></div>
    <div class="punkt"><span class="haken">✓</span><span>Anfragen auch von ausserhalb der Siedlung</span></div>
    <div class="punkt"><span class="haken">✓</span><span>Erster Messtermin steht</span></div>
  </div>
  <p class="dank">Danke, Nachbarn.</p>
  <div class="band"><span class="band__was">Auch dabei sein?</span><span class="band__wo">pfistanbul.ch</span></div>
</div></body></html>
