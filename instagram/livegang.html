<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Live-Gang – Beitrag für Instagram</title>
<style>
/*
 * Der Beitrag zum Live-Gang.
 *
 * Eine Ankündigung braucht Worte, aber Instagram belohnt Bilder – deshalb
 * dieselbe Aufteilung wie beim Titelbild: Schlagzeile oben, Foto in der
 * Mitte, das Wesentliche darunter. Kein QR-Code: Wer das sieht, hält das
 * Telefon schon in der Hand, und der Weg führt über den Link im Profil.
 *
 * Die Adresse steht gross und allein in ihrer Zeile. Sie ist der einzige
 * Grund, warum es diesen Beitrag gibt.
 *
 * Die Preisspanne ist die aus dem Katalog (priceRange), nicht die festen
 * Preise fuers Pfisterhoelzli: Der Beitrag richtet sich nicht mehr nur an die
 * Siedlung. Der Zusatz "bis 2 m²" gehoert dazu - ohne ihn erwartet jemand mit
 * einer Balkontuere von drei Quadratmetern hoechstens 200 Franken.
 *
 * Rendern: node instagram/tafel.mjs livegang
 */
@font-face { font-family: 'Fraunces'; src: url('../public/fonts/fraunces-normal-700-latin.woff2') format('woff2'); font-weight: 700; font-display: block; }
@font-face { font-family: 'Fraunces'; src: url('../public/fonts/fraunces-italic-600-latin.woff2') format('woff2'); font-weight: 600; font-style: italic; font-display: block; }
@font-face { font-family: 'InterPost'; src: url('../public/fonts/inter-normal-400-latin.woff2') format('woff2'); font-weight: 400; font-display: block; }
@font-face { font-family: 'InterPost'; src: url('../public/fonts/inter-normal-600-latin.woff2') format('woff2'); font-weight: 600; font-display: block; }
@font-face { font-family: 'InterPost'; src: url('../public/fonts/inter-normal-700-latin.woff2') format('woff2'); font-weight: 700; font-display: block; }

* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #6b7a75; }

.blatt {
  width: 1080px; height: 1350px;
  padding: 64px 68px 56px;
  background: #faf8f4; color: #17211f;
  font-family: 'InterPost', system-ui, sans-serif;
  display: flex; flex-direction: column;
}

.kopf { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
.marke { display: flex; align-items: center; gap: 18px; }
.marke__zeichen { display: grid; place-items: center; width: 62px; height: 62px; border-radius: 15px; background: #0f3b34; }
.marke__name { font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 36px; line-height: 1; }
.marke__zusatz { font-size: 16px; font-weight: 600; letter-spacing: 0.3em; text-transform: uppercase; color: #4d5b57; }
.jetzt {
  padding: 12px 24px; border-radius: 100px; background: #0f3b34; color: #f7fbf9;
  font-size: 21px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; white-space: nowrap;
}

h1 {
  margin-top: 34px;
  font-family: 'Fraunces', Georgia, serif; font-weight: 700;
  font-size: 96px; line-height: 0.94; letter-spacing: -0.03em;
}
h1 em { display: block; font-style: italic; color: #0f3b34; }

.foto { margin-top: 30px; border-radius: 22px; overflow: hidden; }
.foto img { display: block; width: 100%; height: 420px; object-fit: cover; object-position: center 44%; }

.punkte { margin-top: 28px; display: flex; gap: 14px; }
.punkt {
  flex: 1; padding: 18px 20px; border-radius: 16px; background: #dcefe7;
  font-size: 22px; line-height: 1.32;
}
.punkt b { display: block; font-family: 'Fraunces', Georgia, serif; font-size: 27px; font-weight: 700; margin-bottom: 4px; }

.adresse {
  margin-top: 26px; padding: 24px 30px; border-radius: 18px; background: #0f3b34; color: #f7fbf9;
  text-align: center;
}
.adresse__was { display: block; font-size: 21px; opacity: 0.82; }
.adresse__wo { display: block; margin-top: 6px; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 52px; letter-spacing: -0.01em; }

.fuss { margin-top: auto; padding-top: 22px; border-top: 2px solid #e4ded3; display: flex; align-items: baseline; gap: 16px; }
.fuss__name { font-family: 'Fraunces', Georgia, serif; font-style: italic; font-weight: 600; font-size: 34px; color: #0f3b34; white-space: nowrap; }
.fuss__text { font-size: 21px; line-height: 1.4; color: #4d5b57; }
</style>
</head>
<body>
<div class="blatt">

  <header class="kopf">
    <div class="marke">
      <span class="marke__zeichen">
        <svg width="34" height="34" viewBox="0 0 300 300">
          <rect x="30" y="30" width="240" height="240" rx="30" fill="none" stroke="#f7fbf9" stroke-width="26"/>
          <path d="M30 110H270M30 190H270M110 30V270M190 30V270" stroke="#f7fbf9" stroke-width="18" stroke-linecap="round"/>
        </svg>
      </span>
      <span>
        <span class="marke__name">Pfistanbul</span><br>
        <span class="marke__zusatz">Fenster</span>
      </span>
    </div>
    <span class="jetzt">Ab sofort</span>
  </header>

  <h1>Der Shop ist<em>offen.</em></h1>

  <figure class="foto">
    <img src="../public/fotos/fenster-geschlossen-1600.jpg" alt="">
  </figure>

  <div class="punkte">
    <div class="punkt"><b>CHF 100–200</b>Richtwert bis 2 m²</div>
    <div class="punkt"><b>Direkt bestellen</b>oder Masse anfragen</div>
    <div class="punkt"><b>Meist ohne Bohren</b>Keine Löcher im Rahmen</div>
  </div>

  <div class="adresse">
    <span class="adresse__was">Bestellen unter</span>
    <span class="adresse__wo">pfistanbul.ch</span>
  </div>

  <div class="fuss">
    <p class="fuss__name">Ufuk &amp; Deniz</p>
    <p class="fuss__text">Zwei Nachbarn aus der Siedlung. Die Netze hängen fertig montiert am Pfisterhölzli 38.</p>
  </div>

</div>
</body>
</html>
