<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Story – Wir sind live</title>
<link rel="stylesheet" href="story.css">
<style>
/*
 * Die Ankuendigung in der Bildsprache von "unterwegs": Foto oben, das nach
 * unten in den Markengrund auslaeuft, Text im unteren Drittel.
 *
 * Das Foto zeigt die beiden - bei "wir sind live" ist das "wir" der Punkt.
 * Die Gesichter sitzen im oberen Teil des Originals, deshalb der Bildausschnitt
 * bei 32 Prozent; unten deckt ohnehin der Verlauf ab.
 */
.blatt { position: relative; padding: 0; background: #0f3b34; color: #f7fbf9; overflow: hidden; }
.foto { position: absolute; inset: 0 0 auto 0; height: 1180px; }
.foto img { width: 100%; height: 100%; object-fit: cover; object-position: center 32%; }
.foto::after { content: ''; position: absolute; inset: auto 0 0 0; height: 420px;
               background: linear-gradient(to bottom, rgba(15,59,52,0), #0f3b34 88%); }
.inhalt { position: relative; height: 100%; padding: 250px 80px 300px; display: flex; flex-direction: column; }
.marke__zeichen { background: rgba(0,0,0,.34); color: #f7fbf9; }
.marke { text-shadow: 0 2px 14px rgba(0,0,0,.5); }
.kicker { margin-top: auto; font-size: 24px; font-weight: 700; letter-spacing: 0.26em;
          text-transform: uppercase; color: #9fe3cc; }
h1 { margin-top: 18px; font-size: 118px; }
.satz { margin-top: 32px; font-size: 36px; line-height: 1.38; opacity: .92; max-width: 24ch; }
.band { margin-top: 46px; background: #faf8f4; color: #0f3b34; }
</style></head><body><div class="blatt">
  <figure class="foto"><img src="../public/fotos/team-1600.jpg" alt=""></figure>
  <div class="inhalt">
    <div class="marke"><span class="marke__zeichen"><svg width="34" height="34" viewBox="0 0 300 300"><rect x="30" y="30" width="240" height="240" rx="30" fill="none" stroke="currentColor" stroke-width="26"/><path d="M30 110H270M30 190H270M110 30V270M190 30V270" stroke="currentColor" stroke-width="18" stroke-linecap="round"/></svg></span>
      <span><span class="marke__name">Pfistanbul</span><br><span class="marke__zusatz">Fenster</span></span></div>
    <p class="kicker">Ab sofort</p>
    <h1>Wir sind<em>live.</em></h1>
    <p class="satz">Insektenschutz-Plissee nach Mass. Ab heute können Sie bestellen.</p>
    <div class="band"><span class="band__was">Bestellen unter</span><span class="band__wo">pfistanbul.ch</span></div>
  </div>
</div></body></html>
