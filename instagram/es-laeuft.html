<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Story – Es läuft</title>
<link rel="stylesheet" href="story.css">
<style>
/*
 * Dieselbe Botschaft als ganzflaechiges Bild: Foto ueber die volle Hoehe,
 * dunkler Schleier darueber, Text in der Mitte. Wirkt im Vollbild am
 * staerksten, weil kein Rand die Flaeche bricht.
 *
 * Der Schleier ist noetig, nicht dekorativ - heller Text auf einem hellen
 * Foto ist auf dem Telefon in der Sonne nicht lesbar.
 *
 * "Die ersten Bestellungen sind in Arbeit" MUSS STIMMEN. Sobald die erste
 * Lieferung draussen ist, gehoert der Satz umgeschrieben.
 */
.blatt { position: relative; padding: 0; background: #0f3b34; color: #f7fbf9; overflow: hidden; }
.foto { position: absolute; inset: 0; }
.foto img { width: 100%; height: 100%; object-fit: cover; object-position: center 40%; }
.foto::after { content: ''; position: absolute; inset: 0;
               background: linear-gradient(to bottom, rgba(15,59,52,.86), rgba(9,38,33,.94)); }
.inhalt { position: relative; height: 100%; padding: 250px 80px 300px; display: flex; flex-direction: column; }
.marke__zeichen { background: rgba(255,255,255,.14); color: #f7fbf9; }
.kicker { margin-top: auto; font-size: 24px; font-weight: 700; letter-spacing: 0.26em;
          text-transform: uppercase; color: #9fe3cc; }
h1 { margin-top: 20px; font-size: 150px; }
h1 em { color: #9fe3cc; }
.satz { margin-top: 34px; font-size: 40px; line-height: 1.34; max-width: 21ch; }
.satz b { color: #9fe3cc; font-weight: 700; }
.produkt { margin-top: 30px; font-size: 30px; letter-spacing: 0.04em; opacity: .72; }
.band { margin-top: 52px; background: #faf8f4; color: #0f3b34; }
</style></head><body><div class="blatt">
  <figure class="foto"><img src="../public/fotos/zimmer-storen-1600.jpg" alt=""></figure>
  <div class="inhalt">
    <div class="marke"><span class="marke__zeichen"><svg width="34" height="34" viewBox="0 0 300 300"><rect x="30" y="30" width="240" height="240" rx="30" fill="none" stroke="currentColor" stroke-width="26"/><path d="M30 110H270M30 190H270M110 30V270M190 30V270" stroke="currentColor" stroke-width="18" stroke-linecap="round"/></svg></span>
      <span><span class="marke__name">Pfistanbul</span><br><span class="marke__zusatz">Fenster</span></span></div>
    <p class="kicker">Wir sind live</p>
    <h1>Und es<em>läuft.</em></h1>
    <p class="satz">Die ersten Bestellungen sind in Arbeit. <b>Ihre kann heute dazukommen.</b></p>
    <p class="produkt">Insektenschutz-Plissee nach Mass</p>
    <div class="band"><span class="band__was">Bestellen unter</span><span class="band__wo">pfistanbul.ch</span></div>
  </div>
</div></body></html>
