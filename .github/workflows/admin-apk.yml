# Baut die Android-App fuer den Adminbereich (android/) und legt das APK als
# GitHub-Release ab. Von dort laesst es sich auf dem Handy herunterladen und
# installieren - ohne Play Store.
#
# Braucht zwei Repository-Secrets (Settings -> Secrets and variables ->
# Actions):
#   ANDROID_KEYSTORE_BASE64   der Signaturschluessel, base64-kodiert
#   ANDROID_KEYSTORE_PASSWORT sein Passwort
# Der Schluessel muss IMMER derselbe bleiben: Nur dann laesst sich ein neues
# APK ueber das alte installieren, und nur dann passt er zu
# public/.well-known/assetlinks.json.
name: Admin-App (APK)

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/admin-apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Signaturschluessel bereitlegen
        id: schluessel
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORT: ${{ secrets.ANDROID_KEYSTORE_PASSWORT }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORT" ]; then
            # Probelauf: baut trotzdem, damit Fehler im Android-Projekt
            # auffallen - aber nur als Debug-Fassung, ohne Release.
            echo "::warning::Secrets fehlen - es entsteht nur ein Probe-APK (Debug), kein Release."
            echo "signiert=nein" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "signiert=ja" >> "$GITHUB_OUTPUT"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pfadmin.keystore"
          # Passt der Schluessel zu assetlinks.json? Sonst zeigte die App
          # eine Adresszeile - lieber hier scheitern als auf dem Handy.
          ABDRUCK=$(keytool -list -v -keystore "$RUNNER_TEMP/pfadmin.keystore" -storepass "$KEYSTORE_PASSWORT" \
            | grep 'SHA256:' | head -1 | awk '{print $2}')
          if ! grep -q "$ABDRUCK" public/.well-known/assetlinks.json; then
            echo "::error::Fingerabdruck $ABDRUCK steht nicht in public/.well-known/assetlinks.json."
            exit 1
          fi

      - name: Probe-APK bauen (ohne Schluessel)
        if: steps.schluessel.outputs.signiert != 'ja'
        env:
          PF_VERSION_CODE: ${{ github.run_number }}
        run: |
          gradle -p android assembleDebug --no-daemon
          cp android/app/build/outputs/apk/debug/app-debug.apk "pf-admin-probe-${{ github.run_number }}.apk"

      - name: APK bauen
        if: steps.schluessel.outputs.signiert == 'ja'
        env:
          PF_KEYSTORE: ${{ runner.temp }}/pfadmin.keystore
          PF_KEYSTORE_PASSWORT: ${{ secrets.ANDROID_KEYSTORE_PASSWORT }}
          PF_VERSION_CODE: ${{ github.run_number }}
          PF_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          gradle -p android assembleRelease --no-daemon
          cp android/app/build/outputs/apk/release/app-release.apk "pf-admin-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: pf-admin-apk
          path: pf-admin-*.apk
          if-no-files-found: error

      - name: Als Release veroeffentlichen
        if: steps.schluessel.outputs.signiert == 'ja'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "admin-app-1.0.${{ github.run_number }}" pf-admin-*.apk \
            --target "${{ github.sha }}" \
            --title "PF Admin 1.0.${{ github.run_number }}" \
            --latest=false \
            --notes "Android-App fuer den Adminbereich. Auf dem Handy herunterladen, oeffnen und installieren (Installation aus unbekannten Quellen fuer den Browser einmal erlauben)."
