# Startet die Admin-App in einem Android-Emulator und prueft, dass sie nicht
# abstuerzt. Bei einem Absturz steht der Stacktrace im Log dieses Laufs.
name: Admin-App (Starttest)

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/admin-apk-test.yml'

jobs:
  starttest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Debug-APK bauen
        run: gradle -p android assembleDebug --no-daemon

      - name: KVM freischalten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Im Emulator starten
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash android/starttest.sh android/app/build/outputs/apk/debug/app-debug.apk
