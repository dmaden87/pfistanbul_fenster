<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Vorschaubild für geteilte Links</title>
<style>
/*
 * Das Bild, das erscheint, wenn jemand die Adresse in einem Chat, in
 * WhatsApp oder in einem sozialen Netz teilt.
 *
 * Format 1200 × 630 – das ist, was Open Graph erwartet und was die meisten
 * Dienste ungeschnitten zeigen. Quer statt hoch, also nicht der Flyer und
 * nicht das Instagram-Titelbild, sondern eine eigene Aufteilung: Text links,
 * Foto rechts.
 *
 * Bewusst wenig drauf. Eine Linkvorschau ist im Chat oft nur wenige
 * Zentimeter breit; alles, was auf dem Flyer noch lesbar wäre, wird hier zu
 * grauem Rauschen. Übrig bleiben Marke, Schlagzeile, drei Wörter zur
 * Positionierung und der Einstiegspreis.
 *
 * Warum über den Browser und nicht über sharp: librsvg ignoriert eingebettete
 * woff2-Schriften stillschweigend – der Text käme in einer Ersatzschrift
 * heraus, ohne dass etwas fehlschlägt. Steht ausführlicher in marke/LIESMICH.md.
 */
@font-face { font-family: 'Fraunces'; src: url('../public/fonts/fraunces-normal-700-latin.woff2') format('woff2'); font-weight: 700; font-display: block; }
@font-face { font-family: 'Fraunces'; src: url('../public/fonts/fraunces-italic-600-latin.woff2') format('woff2'); font-weight: 600; font-style: italic; font-display: block; }
@font-face { font-family: 'InterVor'; src: url('../public/fonts/inter-normal-400-latin.woff2') format('woff2'); font-weight: 400; font-display: block; }
@font-face { font-family: 'InterVor'; src: url('../public/fonts/inter-normal-600-latin.woff2') format('woff2'); font-weight: 600; font-display: block; }
@font-face { font-family: 'InterVor'; src: url('../public/fonts/inter-normal-700-latin.woff2') format('woff2'); font-weight: 700; font-display: block; }

* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #faf8f4; }

.blatt {
  width: 1200px; height: 630px;
  display: grid; grid-template-columns: 672px 528px;
  background: #faf8f4; color: #17211f;
  font-family: 'InterVor', system-ui, sans-serif;
  overflow: hidden;
}

.text { padding: 44px 44px 44px 56px; display: flex; flex-direction: column; }

.marke { display: flex; align-items: center; gap: 15px; }
.marke__zeichen { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 13px; background: #0f3b34; }
.marke__name { font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 30px; line-height: 1.04; }
.marke__zusatz { font-size: 13px; font-weight: 600; letter-spacing: 0.3em; text-transform: uppercase; color: #4d5b57; }

h1 {
  margin-top: 30px;
  font-family: 'Fraunces', Georgia, serif; font-weight: 700;
  font-size: 64px; line-height: 0.95; letter-spacing: -0.03em;
}
h1 em { display: block; font-style: italic; color: #0f3b34; }

.satz { margin-top: 22px; font-size: 22px; line-height: 1.42; color: #3c4b47; max-width: 34ch; }
.satz b { font-weight: 600; color: #17211f; }

.preis {
  margin-top: auto; padding: 18px 26px; border-radius: 16px; background: #0f3b34; color: #f7fbf9;
  display: flex; align-items: center; gap: 26px;
}
.preis > div { flex: 1; }
.preis > div + div { border-left: 2px solid rgba(247, 251, 249, 0.28); padding-left: 26px; }
.preis__was { display: block; font-size: 17px; opacity: 0.82; }
.preis__zahl { display: block; margin-top: 2px; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 31px; }

.foto { position: relative; }
.foto img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center 44%; }
/* Schmaler Übergang, damit die Kante zwischen Papier und Foto nicht hart bricht. */
.foto::before {
  content: ''; position: absolute; inset: 0 auto 0 0; width: 90px;
  background: linear-gradient(to right, #faf8f4, rgba(250, 248, 244, 0));
}
</style>
</head>
<body>
<div class="blatt">

  <div class="text">
    <div class="marke">
      <span class="marke__zeichen">
        <svg width="29" height="29" viewBox="0 0 300 300">
          <rect x="30" y="30" width="240" height="240" rx="30" fill="none" stroke="#f7fbf9" stroke-width="26"/>
          <path d="M30 110H270M30 190H270M110 30V270M190 30V270" stroke="#f7fbf9" stroke-width="18" stroke-linecap="round"/>
        </svg>
      </span>
      <span>
        <span class="marke__name">Pfistanbul</span><br>
        <span class="marke__zusatz">Fenster</span>
      </span>
    </div>

    <h1>Fenster auf.<em>Mücken draussen.</em></h1>

    <p class="satz">Insektenschutz-Plissee nach Mass. <b>Von Freunden und Nachbarn für Freunde und Nachbarn.</b></p>

    <div class="preis">
      <div>
        <span class="preis__was">Einzelnes Netz ab</span>
        <span class="preis__zahl">CHF 130</span>
      </div>
      <div>
        <span class="preis__was">Ganze Wohnung ab</span>
        <span class="preis__zahl">CHF 775</span>
      </div>
    </div>
  </div>

  <figure class="foto">
    <img src="../public/fotos/zimmer-storen-1600.jpg" alt="">
  </figure>

</div>
</body>
</html>
